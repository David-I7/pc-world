{% extends "admin/base.html" %}
{% load static %}

{% block title %}
    {{ title }} | {{ site_title }}
{% endblock %}

{% block extrahead %}
    {{ block.super }}
    <link rel="icon" type="image/x-icon" href="{% static 'imagini/app/favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
{% endblock %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}" class="admin-brand-link">
        <img src="{% static 'imagini/app/logo.svg' %}"
             alt="PC World Logo"
            >
        <span>{{ site_header }}</span>
    </a>
</div>
{% endblock %}
